<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Piano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎹 Keyboard Piano</h1>
<p>Press A S D F G H J K L ;</p>

<div class="piano">

    <div class="key" data-song="songs/C1v8.mp3" data-key="a">A</div>
    <div class="key" data-song="songs/C2v8.mp3" data-key="s">S</div>
    <div class="key" data-song="songs/C3v8.mp3" data-key="d">D</div>
    <div class="key" data-song="songs/Ds1v8.mp3" data-key="f">F</div>
    <div class="key" data-song="songs/Ds2v8.mp3" data-key="g">G</div>
    <div class="key" data-song="songs/Ds3v8.mp3" data-key="h">H</div>
    <div class="key" data-song="songs/Fs1v8.mp3" data-key="j">J</div>
    <div class="key" data-song="songs/A1v8.mp3" data-key="k">K</div>
    <div class="key" data-song="songs/A2v8.mp3" data-key="l">L</div>
    <div class="key" data-song="songs/A4v8.mp3" data-key=";">;</div>

</div>

<script src="script.js"></script>

</body>
</html>
